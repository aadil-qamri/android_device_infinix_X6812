- name: Inspect Keymaster configuration
  run: |
    cd "$GITHUB_WORKSPACE"

    echo "=== Device tree Keymaster references ==="
    grep -RniE \
      'keymaster|libkeymaster' \
      device/infinix/X6812 \
      --exclude-dir=.git || true

    echo "=== Vendor proprietary Keymaster files ==="
    find vendor/infinix/X6812 -type f \
      | grep -Ei 'keymaster|libkeymaster' || true

    echo "=== Recovery source Keymaster references ==="
    grep -RniE \
      'keymaster|libkeymaster' \
      system/core system/security bootable/recovery \
      --exclude-dir=.git 2>/dev/null | head -200 || true

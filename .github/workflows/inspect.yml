- name: Trace Keymaster files
  shell: bash
  run: |
    echo "===== DEVICE TREE REFERENCES ====="
    grep -RniE 'keymaster|libkeymaster' \
      device/infinix/X6812 \
      --exclude-dir=.git || true

    echo "===== VENDOR TREE FILES ====="
    find vendor/infinix/X6812 -type f \
      | grep -Ei 'keymaster|libkeymaster' || true

    echo "===== BUILD OUTPUT FILES ====="
    find out/target/product/X6812 \
      -type f \
      | grep -Ei 'keymaster|libkeymaster' || true

    echo "===== COPY RULES ====="
    grep -RniE 'PRODUCT_COPY_FILES|keymaster' \
      device/infinix/X6812 \
      vendor/infinix/X6812 \
      --include='*.mk' \
      --include='*.bp' \
      --include='*.xml' || true
